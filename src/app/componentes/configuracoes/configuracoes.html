<button type="button" class="botao-engrenagem" (click)="alternar()" aria-label="Configurações">
  <i class="bi bi-gear-fill"></i>
</button>

@if (aberto()) {
  <div class="painel">
    <div class="cabecalho">
      <h2>Configurações</h2>
      <button type="button" class="fechar" (click)="alternar()" aria-label="Fechar">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="corpo">
      <div class="abas">
        <button
          type="button"
          class="aba"
          [class.ativa]="abaAtiva() === 'controles'"
          (click)="abaAtiva.set('controles')"
        >
          <i class="bi bi-controller"></i>
          Controles
        </button>
      </div>

      <div class="conteudo">
        @if (abaAtiva() === 'controles') {
          <app-controle-numerico
            rotulo="Sensibilidade da câmera"
            [minimo]="0"
            [maximo]="1"
            [passo]="0.01"
            [valor]="preferencias.sensibilidadeCamera()"
            (valorChange)="preferencias.definirSensibilidadeCamera($event)"
          />

          <button type="button" class="botao-editar-layout" (click)="preferencias.alternarModoEdicaoLayout()">
            <i class="bi" [class.bi-check2]="preferencias.modoEdicaoLayout()" [class.bi-arrows-move]="!preferencias.modoEdicaoLayout()"></i>
            {{ preferencias.modoEdicaoLayout() ? 'Concluir edição do layout' : 'Editar layout' }}
          </button>

          @if (preferencias.modoEdicaoLayout()) {
            <p class="dica">
              Arraste os elementos na tela do jogo pra reposicionar, e use os botões +/- pra
              redimensionar. Feche essa tela pra ver o jogo e editar.
            </p>
          }
        }
      </div>
    </div>
  </div>
}
